system:
  # Toggle between "openai", "local", and "bedrock" to switch inference engines.
  # "bedrock" runs the whole pipeline on AWS Bedrock with ZERO OpenAI dependency
  # (useful when the OpenAI balance is exhausted). Switching to bedrock requires a
  # rebuild+redeploy so the image ships this config; see docs/DEPLOYMENT.md.
  inference_mode: "openai"
  # inference_mode: "local"
  # inference_mode: "bedrock"
  local_llm: "mlx-community/Mistral-7B-Instruct-v0.3-4bit"
  embedding_model: "nomic-ai/nomic-embed-text-v1.5"
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

vector_stores:
  local_collection: "citementor_library"
  openai_collection: "citementor_library_openai"
  bedrock_collection: "citementor_library_bedrock"

openai:
  # Fast API-only path for demos and Streamlit deployment.
  # GPT-5 nano handles simple routing, expansion, and candidate reranking.
  # GPT-5 mini handles final synthesis where answer quality matters more.
  router_model: "gpt-5-nano"
  reranker_model: "gpt-5-nano"
  use_llm_reranker: false
  synthesis_model: "gpt-5-mini"
  ingestion_context_model: "gpt-5-nano"
  ingestion_summary_batch_size: 20
  embedding_model: "text-embedding-3-small"
  eval_model: "gpt-5-mini"

bedrock:
  # AWS Bedrock path — no upfront cost, billed on the monthly AWS invoice. Credentials
  # come from the default AWS chain (no API key); on Lambda the exec role's IAM grants
  # InvokeModel on these models. Uses Amazon-native Nova models (first-party, so NO AWS
  # Marketplace subscription is required — unlike the Anthropic Claude models, whose
  # Marketplace agreement kept expiring on this account). Nova needs cross-region
  # "apac." inference profiles. Tiered like the openai path: cheap router, premium
  # synthesis. Titan V2 re-embeds the corpus into `bedrock_collection`.
  region: "ap-south-1"
  router_model: "apac.amazon.nova-lite-v1:0"
  synthesis_model: "apac.amazon.nova-pro-v1:0"
  embedding_model: "amazon.titan-embed-text-v2:0"

retrieval:
  max_expanded_queries: 2
  semantic_top_k: 10
  lexical_top_k: 10
  bm25_weight: 0.3
  vector_weight: 0.7
  rrf_k: 60
  final_top_n: 3 # The exact number of chunks passed to the LLM synthesis

cache:
  similarity_threshold: 0.88 # 88% semantic similarity required to trigger a cache hit
